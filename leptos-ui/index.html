<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yawnoc Leptos Spike</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: radial-gradient(circle at 20% 0%, #112235 0%, #06090b 55%);
        color: #d2e9f4;
      }
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 20px;
      }
      h1 {
        margin: 0 0 12px;
      }
      .panel-wrap {
        border: 1px solid #2c3a42;
        border-radius: 12px;
        padding: 14px;
        background: #050608;
      }
      .board {
        display: grid;
        grid-template-columns: repeat(16, 1fr);
        gap: 3px;
        width: min(78vw, 620px);
      }
      .cell {
        width: 100%;
        aspect-ratio: 1;
        border: 1px solid #172228;
        border-radius: 2px;
        padding: 0;
        cursor: pointer;
      }
      .controls,
      .patterns {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      button {
        background: #182228;
        color: #d2e9f4;
        border: 1px solid #2d404d;
        border-radius: 6px;
        padding: 8px 12px;
        cursor: pointer;
      }
      button:hover {
        background: #203039;
      }
      .status {
        margin-top: 12px;
        padding: 10px 12px;
        background: #081015;
        border: 1px solid #223440;
        border-radius: 6px;
        min-height: 22px;
      }
    </style>
  </head>
  <body></body>
</html>
